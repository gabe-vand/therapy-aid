# Same-origin front door: serves the SPA *and* forwards its API calls, so the whole app answers
# on one URL and the browser never learns the backend's address. Only the Tailscale sidecar
# reaches this container (docker-compose.yml publishes no ports beyond localhost).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved every second. proxy_pass takes a VARIABLE below so nginx
    # resolves `api` per request rather than once at boot: a redeploy gives the api container a
    # new IP, and a boot-time lookup would keep proxying to the dead one (or refuse to start).
    resolver 127.0.0.11 valid=1s;

    location /api/ {
        set $api_upstream http://api:3010;

        # The backend mounts its routers at bare paths (/hello, /health, …) — strip the marker.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Audio chunks (30 s each) and notes uploads are small, but a pasted transcript or a
        # retried recording is not; 50 MB is generous without being open-ended.
        client_max_body_size 50m;
        # Processing a session (transcribe, summarize, map, refocus) and a tool-using chat reply
        # can each take a couple of minutes; the default 60 s would turn those into 504s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build assets never change under the same name — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path is a client-side route. index.html itself must never be
    # cached, or a redeploy keeps serving the previous build's asset names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
